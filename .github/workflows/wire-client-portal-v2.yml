name: Wire Client Portal v2

on:
  push:
    branches: [codex/client-portal-team-management-v2]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[wired-client-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire assets and auth hardening
        shell: python
        run: |
          from pathlib import Path
          p = Path('client.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="client-team.css">'
          js = '<script src="client-team.js" defer></script>'
          if css not in s:
              s = s.replace('</head>', f'  {css}\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', f'  {js}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client.html
          git commit -m 'chore: wire client portal v2 assets [wired-client-v2]'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/wire-client-portal-v2.yml
          git commit -m 'chore: remove temporary wiring workflow [wired-client-v2]'
          git push
