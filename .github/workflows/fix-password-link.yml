name: Fix password recovery link

on:
  push:
    branches: [fix-password-recovery-link]

permissions:
  contents: write

jobs:
  patch-client-login:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch login UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client.html')
          s = p.read_text(encoding='utf-8')
          old = '''        <button type="button" class="m-btn m-btn-primary" id="loginBtn" style="width: 100%; margin-top: 8px;">تسجيل الدخول</button>'''
          new = '''        <div style="display: flex; justify-content: flex-start; margin-top: -4px;">
          <a href="/reset" style="color: var(--c-accent); font-size: 13px; font-weight: 700; text-decoration: none;">نسيت كلمة المرور؟ استعادة كلمة المرور</a>
        </div>
        <button type="button" class="m-btn m-btn-primary" id="loginBtn" style="width: 100%; margin-top: 4px;">تسجيل الدخول</button>'''
          if old not in s:
              raise SystemExit('Expected login button markup was not found; refusing to modify client.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix missing password recovery link in client login"
          git push
