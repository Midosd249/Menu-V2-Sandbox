<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>استعادة كلمة المرور — Menu</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>body{font-family:Cairo,Arial,sans-serif;background:#f7f5f2;color:#1d1916;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(460px,calc(100% - 32px));background:#fff;border:1px solid #e5dfd8;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 12px 40px #0000000d}label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9d0c7;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#17120f;color:#fff;font:inherit;font-weight:700;cursor:pointer}#status{margin-top:14px;min-height:24px;text-align:center}a{color:#8b5e3c}</style></head><body><main class="card"><h1 id="title">استعادة كلمة المرور</h1><p id="intro">أدخل بريد حسابك وسنرسل لك رابطًا آمنًا لاستعادة كلمة المرور.</p><form id="form"><label id="emailLabel" for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required><label id="passwordLabel" for="password" hidden>كلمة المرور الجديدة</label><input id="password" type="password" minlength="8" autocomplete="new-password" hidden><button id="submit" type="submit">إرسال رابط الاستعادة</button></form><div id="status" aria-live="polite"></div><p><a href="/client">العودة إلى بوابة العميل</a></p></main><script src="/supabase-config.js"></script><script src="/vendor/supabase-js-2.57.4.js"></script><script src="/supabase-client.js"></script><script>(async()=>{const client=window.getMenuSupabaseClient&&window.getMenuSupabaseClient();const form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),status=document.getElementById('status'),submit=document.getElementById('submit'),title=document.getElementById('title'),intro=document.getElementById('intro'),emailLabel=document.getElementById('emailLabel'),passwordLabel=document.getElementById('passwordLabel');if(!client){status.textContent='تعذر تهيئة الاتصال الآمن.';return;}let recovery=false;const sessionResult=await client.auth.getSession();recovery=!!sessionResult?.data?.session;if(recovery){title.textContent='تعيين كلمة مرور جديدة';intro.textContent='اختر كلمة مرور جديدة لحسابك.';email.hidden=true;emailLabel.hidden=true;password.hidden=false;passwordLabel.hidden=false;submit.textContent='حفظ كلمة المرور';}client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){recovery=true;title.textContent='تعيين كلمة مرور جديدة';intro.textContent='اختر كلمة مرور جديدة لحسابك.';email.hidden=true;emailLabel.hidden=true;password.hidden=false;passwordLabel.hidden=false;submit.textContent='حفظ كلمة المرور';}});form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;status.textContent='جارٍ التنفيذ…';try{if(recovery){const{error}=await client.auth.updateUser({password:password.value});if(error)throw error;status.textContent='تم تحديث كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.';form.reset();}else{const{error}=await client.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:new URL('/reset',location.origin).toString()});if(error)throw error;status.textContent='إذا كان البريد مسجلًا، فسيصل إليه رابط الاستعادة.';}}catch(err){status.textContent='تعذر إكمال العملية: '+(err?.message||'حاول مرة أخرى.');}finally{submit.disabled=false;}});})();</script></body></html>
